<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>弹球入洞 - 经典形状大挑战</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050510;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #gameContainer {
            position: relative;
            width: 500px;
            height: 720px;
            max-width: 100vw;
            max-height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 16px;
        }
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(5, 5, 16, 0.88);
            border-radius: 16px;
            z-index: 10;
        }
        .overlay.hidden { display: none; }
        .overlay h1 {
            font-size: 42px;
            color: #FFD700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            margin-bottom: 8px;
            letter-spacing: 4px;
        }
        .overlay h2 {
            font-size: 32px;
            color: #00BFFF;
            text-shadow: 0 0 15px rgba(0, 191, 255, 0.6);
            margin-bottom: 16px;
        }
        .overlay p {
            color: #aaa;
            font-size: 15px;
            margin-bottom: 24px;
            text-align: center;
            line-height: 1.8;
            max-width: 360px;
        }
        .overlay .score-text {
            color: #FFD700;
            font-size: 22px;
            margin-bottom: 8px;
        }
        .overlay .total-score {
            color: #00BFFF;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 24px;
        }
        .btn {
            padding: 14px 40px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            letter-spacing: 2px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1a1a2e;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 215, 0, 0.6); }
        #topBar {
            position: absolute;
            top: 10px; left: 10px; right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
            pointer-events: none;
        }
        .info-pill {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            padding: 6px 14px;
            color: #fff;
            font-size: 14px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .info-pill .label { color: #888; font-size: 11px; }
        .info-pill .value { font-weight: bold; }
        #levelName { color: #FFD700; }
        #scoreValue { color: #00BFFF; }
        #livesValue { color: #FF4444; }
        #speedValue { color: #FFD700; }
        #controls {
            position: absolute;
            bottom: 10px; left: 10px; right: 10px;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 5;
        }
        .ctrl-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 6px 14px;
            color: #ccc;
            font-size: 12px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            font-family: inherit;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .ctrl-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
        #levelDots {
            position: absolute;
            top: 50px; left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 5;
        }
        .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }
        .dot.completed { background: #00BFFF; }
        .dot.current { background: #FFD700; box-shadow: 0 0 8px rgba(255, 215, 0, 0.6); }
        .instruction {
            position: absolute;
            bottom: 50px; left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            z-index: 5;
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<div id="gameContainer">
    <canvas id="gameCanvas" width="500" height="720"></canvas>

    <div id="topBar">
        <div class="info-pill">
            <div class="label">关卡</div>
            <div class="value" id="levelName">圆形</div>
        </div>
        <div class="info-pill" style="display:none">
            <div class="label">生命</div>
            <div class="value" id="livesValue">∞</div>
        </div>
        <div class="info-pill">
            <div class="label">本关掉落</div>
            <div class="value" id="scoreValue">0</div>
        </div>
        <div class="info-pill" style="cursor:pointer" id="speedToggle">
            <div class="label">速度</div>
            <div class="value" id="speedValue">x1.0</div>
        </div>
    </div>

    <div id="levelDots"></div>

    <div class="instruction" id="instruction">移动挡板接球，点击发射</div>

    <div id="controls">
        <button class="ctrl-btn" id="restartBtn">重新开始</button>
        <button class="ctrl-btn" id="resetBallBtn">重置球</button>
        <button class="ctrl-btn" id="speedBtn">速度 x1.0</button>
        <button class="ctrl-btn" id="skipBtn">跳过本关</button>
    </div>

    <div id="menuOverlay" class="overlay">
        <h1>弹球入洞</h1>
        <p>经典形状大挑战<br><br>
        移动绿色挡板接住红球<br>
        球弹入通道击碎金色方块<br>
        再次进入通道穿过缺口<br>
        吃完所有蓝色方块即可过关！<br>
        点击右上角速度切换 1倍/2倍<br><br>
        掉落次数越少，技术越好！</p>
        <button class="btn btn-primary" id="startBtn">开始游戏</button>
    </div>

    <div id="levelCompleteOverlay" class="overlay hidden">
        <h2>关卡完成！</h2>
        <p class="score-text">本关掉落次数: <span id="lcLevelScore">0</span></p>
        <p class="total-score">总掉落次数: <span id="lcTotalScore">0</span></p>
        <button class="btn btn-primary" id="nextLevelBtn">下一关</button>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
        <h1 style="color:#FF4444;text-shadow:0 0 20px rgba(255,68,68,0.6);">游戏结束</h1>
        <p class="score-text">掉落次数: <span id="goScore">0</span></p>
        <button class="btn btn-primary" id="retryBtn">重试本关</button>
    </div>

    <div id="gameCompleteOverlay" class="overlay hidden">
        <h1>通关成功！</h1>
        <p>恭喜你完成了全部10个关卡！</p>
        <div id="gcLevelBreakdown" style="color:#aaa;font-size:14px;line-height:1.8;margin-bottom:12px;text-align:center;"></div>
        <p class="total-score" id="gcTotalScore">0</p>
        <button class="btn btn-primary" id="restartGameBtn">再玩一次</button>
    </div>
</div>

<script>
// ===================== CONFIG =====================
const W = 500, H = 720;
const BALL_R = 6;
const GRAVITY = 0.15;
const BOUNCE_SPEED = 16.2;
const MAX_SPEED = 36;
const PADDLE_W = 80;
const PADDLE_H = 10;
const PADDLE_Y = 660;
const WALL_GAP_Y = 520;
const CEILING_Y = 15;
const FAIL_Y = 708;
const SHAPE_CX = 250, SHAPE_CY = 185, SHAPE_R = 95;
const BLUE_R = 7, BLUE_SPACING = 30;

const LEVELS = [
    { name: '五边形', shape: 'pentagon', channel: 80, gold: 28 },
    { name: '六边形', shape: 'hexagon',  channel: 66, gold: 28 },
    { name: '三角形', shape: 'triangle', channel: 54, gold: 28 },
    { name: '方形',   shape: 'square',   channel: 44, gold: 28 },
    { name: '五角星', shape: 'star',     channel: 38, gold: 14 },
    { name: '心形',   shape: 'heart',    channel: 32, gold: 14 },
    { name: '菱形',   shape: 'diamond',  channel: 28, gold: 14 },
    { name: '八角形', shape: 'octagon',  channel: 24, gold: 14 },
    { name: '十字形', shape: 'cross',    channel: 22, gold: 14 },
    { name: '圆形',   shape: 'circle',   channel: 20, gold: 14 },
];

// totalScore = cumulative drop count across all levels
// levelScore = drop count for current level
// lives = drop counter (kept for legacy references)
let canvas, ctx;
let mode = 'menu';
let levelIdx = 0;
let totalScore = 0;
let levelScore = 0;
let levelDropHistory = [];  // drops per completed level
let lives = 0;
let ball = { x: 250, y: 645, vx: 0, vy: 0, r: BALL_R };
let paddle = { x: 250, y: PADDLE_Y, w: PADDLE_W, h: PADDLE_H };
let walls = [];
let goldWallSeg = null;
let goldActive = false;
let gapA = null, gapB = null;
let polyVerts = [];
let blueBlocks = [];
let consecutiveBlue = 0;  // kept for resetting on paddle hit, no longer triggers boost
let speedMultiplier = 1;  // 1 or 2, user-selected
let particles = [];
let trail = [];
let shakeAmount = 0;
let goldPulse = 0;
let launchFlash = 0;
let audioCtx = null;
let ballInsideShape = false;
let mouseInside = false;

// ===================== SHAPE GENERATION =====================
function generatePolygon(cx, cy, radius, sides) {
    const verts = [];
    const baseAngle = Math.PI / 2 + Math.PI / sides;
    for (let i = 0; i < sides; i++) {
        const angle = baseAngle + (i / sides) * Math.PI * 2;
        verts.push({ x: cx + radius * Math.cos(angle), y: cy + radius * Math.sin(angle) });
    }
    return verts;
}

function generateStar(cx, cy, radius, points) {
    const verts = [];
    const innerR = radius * 0.42;
    const baseAngle = Math.PI / 2 + Math.PI / (points * 2);
    for (let i = 0; i < points * 2; i++) {
        const angle = baseAngle + (i / (points * 2)) * Math.PI * 2;
        const r = i % 2 === 0 ? radius : innerR;
        verts.push({ x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) });
    }
    return verts;
}

function generateHeart(cx, cy, radius) {
    const verts = [];
    const steps = 40;
    const scale = radius / 17;
    for (let i = 0; i < steps; i++) {
        const t = (i / steps) * Math.PI * 2;
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
        verts.push({ x: cx + x * scale, y: cy + y * scale - 5 });
    }
    return verts;
}

function generateDiamond(cx, cy, radius) {
    return [
        { x: cx, y: cy - radius },       // top
        { x: cx + radius, y: cy },        // right
        { x: cx, y: cy + radius },        // bottom
        { x: cx - radius, y: cy },        // left
    ];
}

function generateCross(cx, cy, radius) {
    const r = radius;
    const t = radius * 0.32;
    return [
        { x: cx - t, y: cy - r },    { x: cx + t, y: cy - r },
        { x: cx + t, y: cy - t },    { x: cx + r, y: cy - t },
        { x: cx + r, y: cy + t },    { x: cx + t, y: cy + t },
        { x: cx + t, y: cy + r },    { x: cx - t, y: cy + r },
        { x: cx - t, y: cy + t },    { x: cx - r, y: cy + t },
        { x: cx - r, y: cy - t },    { x: cx - t, y: cy - t },
    ];
}

function getShapeVertices(shape, cx, cy, radius) {
    switch (shape) {
        case 'circle':   return generatePolygon(cx, cy, radius, 48);
        case 'square':   return generatePolygon(cx, cy, radius, 4);
        case 'triangle': return generatePolygon(cx, cy, radius, 3);
        case 'pentagon': return generatePolygon(cx, cy, radius, 5);
        case 'hexagon':  return generatePolygon(cx, cy, radius, 6);
        case 'octagon':  return generatePolygon(cx, cy, radius, 8);
        case 'star':     return generateStar(cx, cy, radius, 5);
        case 'heart':    return generateHeart(cx, cy, radius);
        case 'diamond':  return generateDiamond(cx, cy, radius);
        case 'cross':    return generateCross(cx, cy, radius);
        default:         return generatePolygon(cx, cy, radius, 6);
    }
}

// Helper: find all X intersections of polygon with horizontal line at y
function getPolyXAtY(verts, y) {
    const xs = [];
    const n = verts.length;
    for (let i = 0; i < n; i++) {
        const v1 = verts[i];
        const v2 = verts[(i + 1) % n];
        if ((v1.y < y && v2.y >= y) || (v1.y >= y && v2.y < y)) {
            const t = (y - v1.y) / (v2.y - v1.y);
            xs.push({ x: v1.x + (v2.x - v1.x) * t, edgeIdx: i });
        }
    }
    xs.sort((a, b) => a.x - b.x);
    return xs;
}

function generateLevel(shape, cx, cy, radius, channelWidth, goldWidth) {
    const verts = getShapeVertices(shape, cx, cy, radius);
    const n = verts.length;

    // Find min/max Y of the shape
    let minY = Infinity, maxY = -Infinity;
    for (const v of verts) {
        if (v.y < minY) minY = v.y;
        if (v.y > maxY) maxY = v.y;
    }

    // Channel width = entrance gap width (same value for both)
    // The channel below the shape connects directly to the entrance at the shape's bottom
    const gapLeftX = cx - channelWidth / 2;
    const gapRightX = cx + channelWidth / 2;

    // Find goldY: scan down from top until shape is wide enough for gold gap
    // Only consider spans that contain the center x (cx)
    let goldY = minY;
    for (let y = minY; y <= maxY; y++) {
        const xs = getPolyXAtY(verts, y);
        if (xs.length >= 2) {
            for (let i = 0; i < xs.length - 1; i += 2) {
                if (xs[i].x <= cx && xs[i+1].x >= cx) {
                    const width = xs[i+1].x - xs[i].x;
                    if (width >= goldWidth + 6) {
                        goldY = y;
                    }
                    break;
                }
            }
            if (goldY !== minY) break;
        }
    }

    // Find channelY: scan up from bottom until shape is wide enough for channel gap
    // Only consider spans that contain the center x (cx)
    let channelY = maxY;
    for (let y = maxY; y >= minY; y--) {
        const xs = getPolyXAtY(verts, y);
        if (xs.length >= 2) {
            for (let i = 0; i < xs.length - 1; i += 2) {
                if (xs[i].x <= cx && xs[i+1].x >= cx) {
                    const width = xs[i+1].x - xs[i].x;
                    if (width >= channelWidth + 6) {
                        channelY = y;
                    }
                    break;
                }
            }
            if (channelY !== maxY) break;
        }
    }

    // Gold gap coordinates
    const goldLeftX = cx - goldWidth / 2;
    const goldRightX = cx + goldWidth / 2;

    const wallSegs = [];

    // Shape walls: clip polygon edges to [goldY, channelY] region
    // This creates the shape's border between the gold gap (top) and entrance gap (bottom)
    // The ball must bounce off these walls to navigate from entrance to gold
    for (let i = 0; i < n; i++) {
        const v1 = verts[i];
        const v2 = verts[(i + 1) % n];

        // Skip edges entirely above goldY or below channelY
        if (v1.y <= goldY && v2.y <= goldY) continue;
        if (v1.y >= channelY && v2.y >= channelY) continue;

        let p1 = { x: v1.x, y: v1.y };
        let p2 = { x: v2.x, y: v2.y };

        // Clip at goldY (top boundary)
        if (p1.y < goldY) {
            const t = (goldY - v1.y) / (v2.y - v1.y);
            p1 = { x: v1.x + (v2.x - v1.x) * t, y: goldY };
        }
        if (p2.y < goldY) {
            const t = (goldY - v1.y) / (v2.y - v1.y);
            p2 = { x: v1.x + (v2.x - v1.x) * t, y: goldY };
        }
        // Clip at channelY (bottom boundary)
        if (p1.y > channelY) {
            const t = (channelY - v1.y) / (v2.y - v1.y);
            p1 = { x: v1.x + (v2.x - v1.x) * t, y: channelY };
        }
        if (p2.y > channelY) {
            const t = (channelY - v1.y) / (v2.y - v1.y);
            p2 = { x: v1.x + (v2.x - v1.x) * t, y: channelY };
        }

        // Skip horizontal segments at goldY/channelY (handled by horizontal walls below)
        if (Math.abs(p1.y - goldY) < 0.01 && Math.abs(p2.y - goldY) < 0.01) continue;
        if (Math.abs(p1.y - channelY) < 0.01 && Math.abs(p2.y - channelY) < 0.01) continue;

        if (Math.abs(p2.x - p1.x) > 0.5 || Math.abs(p2.y - p1.y) > 0.5) {
            wallSegs.push({ x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y });
        }
    }

    // Horizontal wall at goldY: seal the top, leaving the gold gap open
    // Only seal the center span (the one containing cx) — other spans are part of the shape border
    const goldXs = getPolyXAtY(verts, goldY);
    for (let i = 0; i < goldXs.length - 1; i += 2) {
        const leftX = goldXs[i].x;
        const rightX = goldXs[i + 1].x;
        if (leftX <= cx && rightX >= cx) {
            if (leftX < goldLeftX) wallSegs.push({ x1: leftX, y1: goldY, x2: goldLeftX, y2: goldY });
            if (rightX > goldRightX) wallSegs.push({ x1: goldRightX, y1: goldY, x2: rightX, y2: goldY });
        }
    }

    // Horizontal wall at channelY: seal the bottom, leaving the entrance gap open
    // Only seal the center span (the one containing cx)
    const chXs = getPolyXAtY(verts, channelY);
    for (let i = 0; i < chXs.length - 1; i += 2) {
        const leftX = chXs[i].x;
        const rightX = chXs[i + 1].x;
        if (leftX <= cx && rightX >= cx) {
            if (leftX < gapLeftX) wallSegs.push({ x1: leftX, y1: channelY, x2: gapLeftX, y2: channelY });
            if (rightX > gapRightX) wallSegs.push({ x1: gapRightX, y1: channelY, x2: rightX, y2: channelY });
        }
    }

    // Vertical channel walls: from shape bottom down to bottom wall
    // Same width as entrance gap - channel connects directly to shape
    wallSegs.push({ x1: gapLeftX, y1: channelY, x2: gapLeftX, y2: WALL_GAP_Y });
    wallSegs.push({ x1: gapRightX, y1: channelY, x2: gapRightX, y2: WALL_GAP_Y });

    // Bottom wall with gap matching channel width
    wallSegs.push({ x1: 0, y1: WALL_GAP_Y, x2: gapLeftX, y2: WALL_GAP_Y });
    wallSegs.push({ x1: gapRightX, y1: WALL_GAP_Y, x2: W, y2: WALL_GAP_Y });

    // Deflector wall: prevents straight vertical path from entrance to gold
    // Forces the ball to bounce off the shape's border, making it effective
    const midY = (goldY + channelY) / 2;
    const deflectorHalf = Math.min(14, channelWidth * 0.35);
    const deflectorOffset = deflectorHalf * 0.5;
    wallSegs.push({
        x1: cx - deflectorHalf, y1: midY + deflectorOffset,
        x2: cx + deflectorHalf, y2: midY - deflectorOffset
    });

    // Gold block at top of shape (horizontal segment)
    const goldA = { x: goldLeftX, y: goldY };
    const goldB = { x: goldRightX, y: goldY };

    return {
        walls: wallSegs,
        gapA: goldA, gapB: goldB,
        polygon: verts,
        channelTopY: channelY,
        goldY: goldY,
        chBotA: { x: gapLeftX, y: WALL_GAP_Y },
        chBotB: { x: gapRightX, y: WALL_GAP_Y },
        goldLeftX, goldRightX, gapLeftX, gapRightX,
        minY, maxY
    };
}

// ===================== LEVEL INIT =====================
function initLevel(idx) {
    const lvl = LEVELS[idx];
    const data = generateLevel(lvl.shape, SHAPE_CX, SHAPE_CY, SHAPE_R, lvl.channel, lvl.gold);

    walls = data.walls.map(w => ({...w}));
    goldWallSeg = { x1: data.gapA.x, y1: data.gapA.y, x2: data.gapB.x, y2: data.gapB.y };
    goldActive = true;
    gapA = data.gapA;
    gapB = data.gapB;
    polyVerts = data.polygon;

    // Generate blue blocks OUTSIDE shape, OUTSIDE channel, ABOVE bottom wall
    blueBlocks = [];
    const chTopY = data.channelTopY;
    const chLeftX = data.chBotA.x;
    const chRightX = data.chBotB.x;
    for (let bx = 20; bx <= W - 20; bx += BLUE_SPACING) {
        for (let by = CEILING_Y + 20; by < WALL_GAP_Y - 10; by += BLUE_SPACING) {
            // Skip if inside the shape
            if (pointInPolygon(bx, by, polyVerts)) continue;
            // Skip if inside or near the rectangular channel passage
            if (by > chTopY - BLUE_R && bx > chLeftX - BLUE_R && bx < chRightX + BLUE_R) continue;
            blueBlocks.push({ x: bx, y: by, r: BLUE_R, alive: true, pulse: Math.random() * Math.PI * 2 });
        }
    }

    ball.x = paddle.x;
    ball.y = paddle.y - BALL_R - 2;
    ball.vx = 0;
    ball.vy = 0;
    consecutiveBlue = 0;
    // speedMultiplier persists across levels (user choice)
    particles = [];
    trail = [];
    ballInsideShape = false;
    shakeAmount = 0;
    launchFlash = 0;
    levelScore = 0;
    lives = 0;
    mode = 'ready';

    updateUI();
}

// ===================== PHYSICS =====================
function pointInPolygon(x, y, verts) {
    let inside = false;
    for (let i = 0, j = verts.length - 1; i < verts.length; j = i++) {
        const xi = verts[i].x, yi = verts[i].y;
        const xj = verts[j].x, yj = verts[j].y;
        if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) {
            inside = !inside;
        }
    }
    return inside;
}

function ballSegmentCollision(b, seg) {
    const dx = seg.x2 - seg.x1;
    const dy = seg.y2 - seg.y1;
    const lenSq = dx*dx + dy*dy;
    if (lenSq < 0.001) return false;
    let t = ((b.x - seg.x1) * dx + (b.y - seg.y1) * dy) / lenSq;
    t = Math.max(0, Math.min(1, t));
    const cx = seg.x1 + t * dx;
    const cy = seg.y1 + t * dy;
    const ddx = b.x - cx;
    const ddy = b.y - cy;
    const distSq = ddx*ddx + ddy*ddy;
    if (distSq < b.r * b.r) {
        const dist = Math.sqrt(distSq) || 0.001;
        const nx = ddx / dist;
        const ny = ddy / dist;
        const overlap = b.r - dist;
        b.x += nx * overlap;
        b.y += ny * overlap;
        const dot = b.vx * nx + b.vy * ny;
        if (dot < 0) {
            b.vx -= 2 * dot * nx;
            b.vy -= 2 * dot * ny;
            b.vx += (Math.random() - 0.5) * 0.2;
            b.vy += (Math.random() - 0.5) * 0.2;
        }
        return true;
    }
    return false;
}

function ballCircleCollision(b, c) {
    const dx = b.x - c.x;
    const dy = b.y - c.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < b.r + c.r) {
        const nx = dx / (dist || 0.001);
        const ny = dy / (dist || 0.001);
        const overlap = b.r + c.r - dist;
        b.x += nx * overlap;
        b.y += ny * overlap;
        const dot = b.vx * nx + b.vy * ny;
        if (dot < 0) {
            b.vx -= 2 * dot * nx;
            b.vy -= 2 * dot * ny;
        }
        return true;
    }
    return false;
}

function getCurrentBounceSpeed() {
    return BOUNCE_SPEED * speedMultiplier;
}

function clampSpeed() {
    const sp = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
    if (sp > MAX_SPEED) {
        ball.vx = (ball.vx / sp) * MAX_SPEED;
        ball.vy = (ball.vy / sp) * MAX_SPEED;
    }
}

function updatePhysics() {
    if (mode !== 'playing' && mode !== 'ready') return;
    if (mode === 'ready') return;

    // Apply gravity
    ball.vy += GRAVITY;
    clampSpeed();

    const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
    const steps = Math.max(1, Math.ceil(speed / (BALL_R * 0.5)));
    const dt = 1 / steps;

    for (let s = 0; s < steps; s++) {
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;

        // Canvas boundaries
        if (ball.x < BALL_R) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); playSound('wall'); }
        if (ball.x > W - BALL_R) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); playSound('wall'); }
        if (ball.y < CEILING_Y + BALL_R) { ball.y = CEILING_Y + BALL_R; ball.vy = Math.abs(ball.vy); playSound('wall'); }

        // Gold block collision
        if (goldActive && goldWallSeg) {
            if (ballSegmentCollision(ball, goldWallSeg)) {
                goldActive = false;
                spawnParticles((gapA.x + gapB.x)/2, (gapA.y + gapB.y)/2, '#FFD700', 20);
                playSound('goldBreak');
                consecutiveBlue = 0;
            }
        }

        // Wall collisions
        for (const w of walls) {
            if (ballSegmentCollision(ball, w)) {
                playSound('wall');
            }
        }

        // Blue block collisions
        for (let i = blueBlocks.length - 1; i >= 0; i--) {
            const blk = blueBlocks[i];
            if (!blk.alive) continue;
            if (ballCircleCollision(ball, blk)) {
                blk.alive = false;
                blueBlocks.splice(i, 1);
                consecutiveBlue++;
                spawnParticles(blk.x, blk.y, '#00BFFF', 12);
                playSound('blueHit');

                // Check level complete
                if (blueBlocks.length === 0) {
                    mode = 'levelComplete';
                    setTimeout(showLevelComplete, 500);
                    playSound('levelComplete');
                    return;
                }
            }
        }

        // Paddle collision
        if (ball.vy > 0 &&
            ball.y + ball.r >= paddle.y &&
            ball.y - ball.r <= paddle.y + paddle.h + 4 &&
            ball.x >= paddle.x - paddle.w/2 - ball.r &&
            ball.x <= paddle.x + paddle.w/2 + ball.r) {
            ball.y = paddle.y - ball.r;
            const hitPos = (ball.x - paddle.x) / (paddle.w / 2);
            ball.vy = -getCurrentBounceSpeed();
            ball.vx = hitPos * 4.5;
            launchFlash = 0.8;
            consecutiveBlue = 0;
            playSound('paddle');
        }

        // Check fail
        if (ball.y > FAIL_Y) {
            lives++;
            levelScore++;
            totalScore++;
            ball.x = paddle.x;
            ball.y = paddle.y - BALL_R - 2;
            ball.vx = 0;
            ball.vy = 0;
            consecutiveBlue = 0;
            mode = 'ready';
            playSound('lifeLost');
            return;
        }
    }

    // Track shape entry/exit
    if (goldActive) {
        ballInsideShape = false;
    } else {
        const inside = pointInPolygon(ball.x, ball.y, polyVerts);
        if (!inside && ballInsideShape) {
            consecutiveBlue = 0;
        }
        ballInsideShape = inside;
    }

    // Trail
    trail.push({ x: ball.x, y: ball.y });
    if (trail.length > 14) trail.shift();

    // Shake decay
    if (shakeAmount > 0) shakeAmount *= 0.85;
    if (launchFlash > 0) launchFlash *= 0.9;
}

// ===================== PARTICLES =====================
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2 + Math.random() * 0.3;
        const speed = 1 + Math.random() * 3.5;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            color,
            r: 2 + Math.random() * 3
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.94;
        p.vy *= 0.94;
        p.life -= 0.025;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

// ===================== RENDERING =====================
function render() {
    ctx.save();

    if (shakeAmount > 0.5) {
        ctx.translate((Math.random()-0.5) * shakeAmount, (Math.random()-0.5) * shakeAmount);
    }

    // Background
    const bgGrad = ctx.createRadialGradient(W/2, H/2, 50, W/2, H/2, 500);
    bgGrad.addColorStop(0, '#0d0d28');
    bgGrad.addColorStop(1, '#050510');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // Grid
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    goldPulse += 0.06;

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Draw walls (black with subtle glow)
    ctx.shadowColor = 'rgba(100,100,120,0.4)';
    ctx.shadowBlur = 6;
    ctx.strokeStyle = '#2a2a3e';
    ctx.lineWidth = 5;
    for (const w of walls) {
        ctx.beginPath();
        ctx.moveTo(w.x1, w.y1);
        ctx.lineTo(w.x2, w.y2);
        ctx.stroke();
    }
    // Inner highlight
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#444460';
    ctx.lineWidth = 2;
    for (const w of walls) {
        ctx.beginPath();
        ctx.moveTo(w.x1, w.y1);
        ctx.lineTo(w.x2, w.y2);
        ctx.stroke();
    }

    // Draw gold block
    if (goldActive && goldWallSeg) {
        const pulse = 0.5 + Math.sin(goldPulse) * 0.3;
        ctx.shadowColor = '#FFD700';
        ctx.shadowBlur = 15 + pulse * 10;
        ctx.strokeStyle = `rgba(255, 215, 0, ${0.85 + pulse * 0.15})`;
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(goldWallSeg.x1, goldWallSeg.y1);
        ctx.lineTo(goldWallSeg.x2, goldWallSeg.y2);
        ctx.stroke();

        // Arrow indicator
        const gapMidX = (goldWallSeg.x1 + goldWallSeg.x2) / 2;
        const gapMidY = (goldWallSeg.y1 + goldWallSeg.y2) / 2;
        ctx.shadowBlur = 0;
        ctx.fillStyle = `rgba(255, 215, 0, ${0.3 + pulse * 0.3})`;
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('▼', gapMidX, gapMidY - 12);
    }
    ctx.shadowBlur = 0;

    // Draw blue blocks
    for (const blk of blueBlocks) {
        if (!blk.alive) continue;
        blk.pulse += 0.04;
        const pulse = 0.7 + Math.sin(blk.pulse) * 0.3;
        ctx.shadowColor = '#00BFFF';
        ctx.shadowBlur = 8 + pulse * 4;
        const grad = ctx.createRadialGradient(blk.x, blk.y, 0, blk.x, blk.y, blk.r);
        grad.addColorStop(0, '#7FDFFF');
        grad.addColorStop(0.6, '#00BFFF');
        grad.addColorStop(1, '#0080CC');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(blk.x, blk.y, blk.r, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.shadowBlur = 0;

    // Draw trail
    for (let i = 0; i < trail.length; i++) {
        const alpha = (i / trail.length) * 0.4;
        const r = BALL_R * (i / trail.length) * 0.7;
        ctx.fillStyle = `rgba(255, 80, 80, ${alpha})`;
        ctx.beginPath();
        ctx.arc(trail[i].x, trail[i].y, r, 0, Math.PI * 2);
        ctx.fill();
    }

    // Draw ball (red)
    if (mode === 'playing' || mode === 'ready') {
        ctx.shadowColor = '#FF4444';
        ctx.shadowBlur = 12 + launchFlash * 20;
        const ballGrad = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 0, ball.x, ball.y, BALL_R);
        ballGrad.addColorStop(0, '#FF8888');
        ballGrad.addColorStop(0.7, '#FF3333');
        ballGrad.addColorStop(1, '#CC0000');
        ctx.fillStyle = ballGrad;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    // Draw paddle (green)
    ctx.shadowColor = '#00FF66';
    ctx.shadowBlur = 12;
    const padGrad = ctx.createLinearGradient(paddle.x - paddle.w/2, paddle.y, paddle.x + paddle.w/2, paddle.y);
    padGrad.addColorStop(0, '#00CC44');
    padGrad.addColorStop(0.5, '#00FF66');
    padGrad.addColorStop(1, '#00CC44');
    ctx.fillStyle = padGrad;
    ctx.beginPath();
    ctx.roundRect(paddle.x - paddle.w/2, paddle.y, paddle.w, paddle.h, 5);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Draw particles
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    // Draw consecutive blue indicator
    if (consecutiveBlue > 0 && mode === 'playing') {
        ctx.fillStyle = `rgba(0, 191, 255, ${0.5 + consecutiveBlue * 0.15})`;
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        const text = '连击 ' + consecutiveBlue + '/3';
        ctx.fillText(text, W/2, H - 65);
    }

    ctx.restore();
}

// ===================== INPUT =====================
function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const sx = canvas.width / rect.width;
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    return { x: (cx - rect.left) * sx };
}

function onPointerDown(e) {
    e.preventDefault();
    if (audioCtx === null) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(ex) {}
    }
    const pos = getCanvasPos(e);
    paddle.x = Math.max(paddle.w/2, Math.min(W - paddle.w/2, pos.x));

    if (mode === 'ready') {
        ball.x = paddle.x;
        ball.vy = -getCurrentBounceSpeed();
        ball.vx = 0;
        mode = 'playing';
        launchFlash = 1;
        playSound('launch');
    }
}

function onPointerMove(e) {
    e.preventDefault();
    if (mode === 'menu' || mode === 'levelComplete' || mode === 'gameOver' || mode === 'gameComplete') return;
    const pos = getCanvasPos(e);
    paddle.x = Math.max(paddle.w/2, Math.min(W - paddle.w/2, pos.x));
    if (mode === 'ready') {
        ball.x = paddle.x;
    }
}

function onKeyDown(e) {
    if (e.key === ' ' || e.key === 'Enter') {
        if (mode === 'ready') {
            ball.vy = -getCurrentBounceSpeed();
            ball.vx = 0;
            mode = 'playing';
            launchFlash = 1;
            playSound('launch');
        }
    }
    if (e.key === 'ArrowLeft') {
        paddle.x = Math.max(paddle.w/2, paddle.x - 20);
        if (mode === 'ready') ball.x = paddle.x;
    }
    if (e.key === 'ArrowRight') {
        paddle.x = Math.min(W - paddle.w/2, paddle.x + 20);
        if (mode === 'ready') ball.x = paddle.x;
    }
}

// ===================== AUDIO =====================
function playSound(type) {
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        switch (type) {
            case 'wall':
                osc.type = 'square';
                osc.frequency.value = 150;
                gain.gain.setValueAtTime(0.03, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
                osc.start(now); osc.stop(now + 0.06);
                break;
            case 'paddle':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(500, now + 0.08);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
                break;
            case 'blueHit':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
                gain.gain.setValueAtTime(0.07, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
                break;
            case 'goldBreak':
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.25);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
                break;
            case 'speedBoost':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(1800, now + 0.35);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
                break;
            case 'launch':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gain.gain.setValueAtTime(0.07, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                osc.start(now); osc.stop(now + 0.12);
                break;
            case 'lifeLost':
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                osc.start(now); osc.stop(now + 0.35);
                break;
            case 'levelComplete':
                [523, 659, 784, 1047].forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.type = 'sine';
                    o.frequency.value = freq;
                    g.gain.setValueAtTime(0, now + i * 0.1);
                    g.gain.linearRampToValueAtTime(0.1, now + i * 0.1 + 0.02);
                    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.3);
                    o.start(now + i * 0.1);
                    o.stop(now + i * 0.1 + 0.3);
                });
                break;
            case 'gameOver':
                [400, 350, 300, 200].forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.type = 'sawtooth';
                    o.frequency.value = freq;
                    g.gain.setValueAtTime(0, now + i * 0.15);
                    g.gain.linearRampToValueAtTime(0.08, now + i * 0.15 + 0.02);
                    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 0.3);
                    o.start(now + i * 0.15);
                    o.stop(now + i * 0.15 + 0.3);
                });
                break;
        }
    } catch(ex) {}
}

// ===================== UI =====================
function updateUI() {
    document.getElementById('levelName').textContent = `${levelIdx + 1}. ${LEVELS[levelIdx].name}`;
    document.getElementById('scoreValue').textContent = levelScore;
    document.getElementById('livesValue').textContent = '∞';
    document.getElementById('speedValue').textContent = `x${speedMultiplier.toFixed(1)}`;
    const speedBtn = document.getElementById('speedBtn');
    if (speedBtn) speedBtn.textContent = `速度 x${speedMultiplier.toFixed(1)}`;

    const dotsContainer = document.getElementById('levelDots');
    dotsContainer.innerHTML = '';
    for (let i = 0; i < LEVELS.length; i++) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        if (i < levelIdx) dot.classList.add('completed');
        if (i === levelIdx) dot.classList.add('current');
        dotsContainer.appendChild(dot);
    }

    const inst = document.getElementById('instruction');
    if (mode === 'ready') {
        inst.textContent = '移动挡板，点击/空格发射小球';
        inst.style.display = '';
    } else if (mode === 'playing' && goldActive) {
        inst.textContent = '球进通道穿入形状内部碰金色，吃完蓝色过关';
        inst.style.display = '';
    } else if (mode === 'playing' && !goldActive) {
        inst.textContent = '金色已破！继续吃完蓝色方块过关';
        inst.style.display = '';
    } else {
        inst.style.display = 'none';
    }
}

function showLevelComplete() {
    // Record this level's drop count
    levelDropHistory[levelIdx] = levelScore;
    document.getElementById('lcLevelScore').textContent = levelScore;
    document.getElementById('lcTotalScore').textContent = totalScore;
    document.getElementById('levelCompleteOverlay').classList.remove('hidden');
}

function showGameOver() {
    document.getElementById('goScore').textContent = totalScore;
    document.getElementById('gameOverOverlay').classList.remove('hidden');
}

function showGameComplete() {
    // Build per-level breakdown
    const breakdownEl = document.getElementById('gcLevelBreakdown');
    let html = '';
    for (let i = 0; i < LEVELS.length; i++) {
        const drops = levelDropHistory[i] !== undefined ? levelDropHistory[i] : 0;
        html += `${LEVELS[i].name}: ${drops}次<br>`;
    }
    breakdownEl.innerHTML = html;
    document.getElementById('gcTotalScore').textContent = `总掉落次数: ${totalScore}`;
    document.getElementById('gameCompleteOverlay').classList.remove('hidden');
}

// ===================== GAME LOOP =====================
function gameLoop() {
    updatePhysics();
    updateParticles();
    render();
    updateUI();
    requestAnimationFrame(gameLoop);
}

// ===================== INIT =====================
function init() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');

    canvas.addEventListener('mousedown', onPointerDown);
    canvas.addEventListener('mousemove', onPointerMove);
    canvas.addEventListener('mouseup', (e) => e.preventDefault());
    canvas.addEventListener('touchstart', onPointerDown, { passive: false });
    canvas.addEventListener('touchmove', onPointerMove, { passive: false });
    canvas.addEventListener('touchend', (e) => e.preventDefault(), { passive: false });
    window.addEventListener('keydown', onKeyDown);

    // Speed toggle: 1x / 2x (top bar + bottom button)
    const toggleSpeed = () => {
        speedMultiplier = speedMultiplier === 1 ? 2 : 1;
        updateUI();
    };
    document.getElementById('speedToggle').addEventListener('click', toggleSpeed);
    document.getElementById('speedBtn').addEventListener('click', toggleSpeed);

    document.getElementById('startBtn').addEventListener('click', () => {
        document.getElementById('menuOverlay').classList.add('hidden');
        levelIdx = 0;
        totalScore = 0;
        levelDropHistory = [];
        initLevel(0);
    });

    document.getElementById('nextLevelBtn').addEventListener('click', () => {
        document.getElementById('levelCompleteOverlay').classList.add('hidden');
        levelIdx++;
        if (levelIdx >= LEVELS.length) {
            mode = 'gameComplete';
            showGameComplete();
        } else {
            initLevel(levelIdx);
        }
    });

    document.getElementById('retryBtn').addEventListener('click', () => {
        document.getElementById('gameOverOverlay').classList.add('hidden');
        totalScore -= levelScore;
        initLevel(levelIdx);
    });

    document.getElementById('restartGameBtn').addEventListener('click', () => {
        document.getElementById('gameCompleteOverlay').classList.add('hidden');
        levelIdx = 0;
        totalScore = 0;
        levelDropHistory = [];
        initLevel(0);
    });

    document.getElementById('restartBtn').addEventListener('click', () => {
        if (mode === 'menu') return;
        totalScore -= levelScore;
        initLevel(levelIdx);
    });

    document.getElementById('resetBallBtn').addEventListener('click', () => {
        if (mode === 'menu' || mode === 'gameComplete' || mode === 'levelComplete') return;
        ball.x = paddle.x;
        ball.y = paddle.y - BALL_R - 2;
        ball.vx = 0;
        ball.vy = 0;
        consecutiveBlue = 0;
        mode = 'ready';
    });

    document.getElementById('skipBtn').addEventListener('click', () => {
        if (mode === 'menu' || mode === 'gameComplete') return;
        document.getElementById('levelCompleteOverlay').classList.add('hidden');
        document.getElementById('gameOverOverlay').classList.add('hidden');
        levelIdx++;
        if (levelIdx >= LEVELS.length) {
            mode = 'gameComplete';
            showGameComplete();
        } else {
            initLevel(levelIdx);
        }
    });

    gameLoop();
}

window.addEventListener('load', init);
</script>
